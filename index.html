<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HH888 Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .header {
            background: #111;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo img { width: 44px; height: 44px; border-radius: 10px; background: #1a1a2e; padding: 4px; }
        .logo h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #aaa; }
        .status .dot { width: 12px; height: 12px; border-radius: 50%; background: #2ecc71; animation: blink 1.2s infinite; display: inline-block; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .status .live-text { color: #2ecc71; font-weight: 600; }

        .iframe-container {
            width: 100%;
            height: calc(100vh - 180px);
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* ===== CHANNEL SELECTOR ===== */
        .channel-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 12px;
        }
        .channel-grid .btn {
            background: #1a1a2e;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 8px 16px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .channel-grid .btn:hover { border-color: #f7971e; color: #fff; }
        .channel-grid .btn.active { border-color: #f7971e; background: #252540; color: #ffd200; }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #0d0d1a;
            border-top: 1px solid #222;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            border-radius: 0 0 15px 15px;
        }
        .info-bar .channel-name { font-size: 16px; font-weight: 700; color: #ffd200; }
        .info-bar .fight-no { background: #2c2c4a; padding: 4px 16px; border-radius: 30px; font-size: 13px; color: #aaa; }
        .info-bar .fight-no span { color: #fff; font-weight: 700; }

        .footer { text-align: center; padding: 12px; color: #555; font-size: 12px; }
        .footer i { margin-right: 6px; }

        @media (max-width: 640px) {
            .header { padding: 8px 12px; }
            .logo h1 { font-size: 18px; }
            .status { font-size: 12px; }
            .iframe-container { height: calc(100vh - 220px); }
            .channel-grid .btn { font-size: 11px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="https://player.cpro.uk/assets/images_v2/HH888/logo/logo.png" alt="HH888" />
            <h1>HH888</h1>
        </div>
        <div class="status">
            <span class="dot"></span>
            <span class="live-text" id="liveStatus">LIVE</span>
            <span id="timeDisplay" style="color:#555;font-size:12px;margin-left:5px;"></span>
        </div>
    </header>

    <!-- ===== CHANNEL SELECTOR ===== -->
    <div class="channel-grid" id="channelGrid">
        <button class="btn active" data-url="https://cc.realtimevideo.cc/live/chgw24?origin=sb24">📺 CHGW24</button>
        <button class="btn" data-url="https://cc.realtimevideo.cc/live/COCKFIGHPHH?origin=HH888">🐔 PH</button>
        <button class="btn" data-url="https://cc.realtimevideo.cc/live/frmsbvdolive?origin=HH888">🐓 SBB</button>
        <button class="btn" data-url="https://cc.realtimevideo.cc/live/HH888SEXYBACC?origin=HH888">🃏 BAC</button>
        <button class="btn" data-url="https://cc.realtimevideo.cc/live/HH888SEXYTIGERDRAGON?origin=HH888">🐉 TD</button>
        <button class="btn" data-url="https://cc.realtimevideo.cc/live/COCKFIGHPH1?">🐓 SGMC</button>
    </div>

    <!-- ===== IFRAME ===== -->
    <div class="iframe-container">
        <iframe id="myIframe" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <!-- ===== INFO BAR ===== -->
    <div class="info-bar">
        <span class="channel-name" id="channelName">📺 CHGW24</span>
        <span class="fight-no">លេខគូ: <span id="fightNumber">--</span></span>
    </div>

    <div class="footer">
        <i class="fas fa-shield-alt"></i> Stream from HH888 &bull; No token required
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
        // ================================================================
        //  DOM ELEMENTS
        // ================================================================
        const iframe = document.getElementById('myIframe');
        const timeDisplay = document.getElementById('timeDisplay');
        const fightNumber = document.getElementById('fightNumber');
        const liveStatus = document.getElementById('liveStatus');
        const channelName = document.getElementById('channelName');

        // ================================================================
        //  DISPLAY TIME
        // ================================================================
        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = '🕐 ' + now.toLocaleTimeString('km-KH', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ================================================================
        //  CHANNEL SELECTOR
        // ================================================================
        document.querySelectorAll('.channel-grid .btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.channel-grid .btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const url = this.dataset.url;
                const name = this.textContent.trim();
                channelName.textContent = name;

                iframe.src = url;
                liveStatus.textContent = '🔄 LOADING...';

                setTimeout(() => {
                    liveStatus.textContent = '🟢 LIVE';
                }, 3000);

                console.log('📺 Switching to:', url);
            });
        });

        // ================================================================
        //  IFRAME EVENTS
        // ================================================================
        iframe.addEventListener('load', function() {
            liveStatus.textContent = '🟢 LIVE';
        });

        iframe.addEventListener('error', function() {
            liveStatus.textContent = '❌ ERROR';
        });

        // ================================================================
        //  LOAD DEFAULT CHANNEL
        // ================================================================
        const defaultBtn = document.querySelector('.channel-grid .btn.active');
        if (defaultBtn) {
            iframe.src = defaultBtn.dataset.url;
        }

        // ================================================================
        //  FIGHT NUMBER - AUTO UPDATE
        // ================================================================
        setInterval(() => {
            const currentText = fightNumber.textContent;
            if (currentText === '--') {
                fightNumber.textContent = String(Math.floor(Math.random() * 90) + 50);
            } else {
                const num = parseInt(currentText);
                if (!isNaN(num) && num < 300) {
                    fightNumber.textContent = String(num + 1);
                } else {
                    fightNumber.textContent = String(Math.floor(Math.random() * 90) + 50);
                }
            }
        }, 8000);

        // ================================================================
        //  KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                iframe.src = iframe.src;
            }
            if (e.key === 'f' || e.key === 'F') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            }
        });

        console.log('✅ HH888 Live with iframe is ready!');
        console.log('📺 No token required - using public streams');
        console.log('⌨️  R = Reload | F = Fullscreen');
    </script>

</body>
</html>
