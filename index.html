<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HH888 Live</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: #111;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #aaa;
        }

        .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            animation: blink 1.2s infinite;
            display: inline-block;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status .live-text {
            color: #2ecc71;
            font-weight: 600;
        }

        /* ===== NOTICE BAR ===== */
        .notice {
            background: #1a1a2e;
            color: #f7971e;
            text-align: center;
            padding: 10px 16px;
            font-size: 14px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .notice .login-btn {
            background: #f7971e;
            color: #0a0a0a;
            border: none;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .notice .login-btn:hover {
            background: #ffd200;
            transform: scale(1.05);
        }

        .notice .status-text {
            font-size: 13px;
            color: #888;
        }

        /* ===== IFRAME ===== */
        .iframe-container {
            width: 100%;
            height: calc(100vh - 120px);
            background: #000;
            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #222;
            border-top-color: #f7971e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-overlay p {
            font-size: 14px;
            color: #888;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header {
                padding: 8px 12px;
            }
            .logo h1 {
                font-size: 18px;
            }
            .status {
                font-size: 11px;
            }
            .status .dot {
                width: 8px;
                height: 8px;
            }
            .notice {
                font-size: 12px;
                padding: 8px 12px;
                flex-direction: column;
                gap: 6px;
            }
            .iframe-container {
                height: calc(100vh - 110px);
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">
            <img src="https://player.cpro.uk/assets/images_v2/HH888/logo/logo.png" alt="HH888" />
            <h1>HH888</h1>
        </div>
        <div class="status">
            <span class="dot"></span>
            <span class="live-text" id="liveStatus">LIVE</span>
            <span id="timeDisplay" style="color:#555;font-size:12px;"></span>
        </div>
    </header>

    <!-- ===== NOTICE ===== -->
    <div class="notice" id="noticeBar">
        <span>🔑 សូមចុចប៊ូតុងខាងក្រោមដើម្បី Login</span>
        <button class="login-btn" onclick="login()">🔐 ចូលប្រើ</button>
        <span class="status-text" id="loginStatus">(មិនទាន់បានចូលប្រើ)</span>
    </div>

    <!-- ===== IFRAME ===== -->
    <div class="iframe-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>⏳ កំពុងផ្ទុក...</p>
        </div>
        <iframe
            id="mainIframe"
            src="about:blank"
            allow="autoplay; encrypted-media; fullscreen"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
    </div>

    <script>
        // ================================================================
        //  VARIABLES
        // ================================================================
        const iframe = document.getElementById('mainIframe');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loginStatus = document.getElementById('loginStatus');
        const liveStatus = document.getElementById('liveStatus');
        const timeDisplay = document.getElementById('timeDisplay');

        let isLoggedIn = false;

        // ================================================================
        //  TIME
        // ================================================================
        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = '🕐 ' + now.toLocaleTimeString('km-KH', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ================================================================
        //  LOGIN FUNCTION
        // ================================================================
        function login() {
            // ===== បើកទំព័រចូលប្រើ =====
            iframe.src = 'https://zh888.vip/login';
            loadingOverlay.classList.remove('hidden');
            loginStatus.textContent = '⏳ កំពុងភ្ជាប់...';
            liveStatus.textContent = 'CONNECTING...';

            // ===== បន្ទាប់ពី 5 វិនាទី ប្តូរទៅទំព័រដើម =====
            setTimeout(() => {
                iframe.src = 'https://zh888.vip';
                loginStatus.textContent = '✅ បានភ្ជាប់រួចរាល់!';
                liveStatus.textContent = 'LIVE';
                document.querySelector('.notice .login-btn').textContent = '🔄 ផ្ទុកឡើងវិញ';
                document.querySelector('.notice .login-btn').onclick = function() {
                    location.reload();
                };
                isLoggedIn = true;
            }, 5000);
        }

        // ================================================================
        //  HIDE LOADING OVERLAY
        // ================================================================
        iframe.addEventListener('load', function() {
            setTimeout(function() {
                loadingOverlay.classList.add('hidden');
            }, 500);
        });

        // ================================================================
        //  TIMEOUT
        // ================================================================
        setTimeout(function() {
            if (!loadingOverlay.classList.contains('hidden')) {
                loadingOverlay.innerHTML = `
                    <div style="font-size:48px;margin-bottom:20px;">⚠️</div>
                    <p style="font-size:16px;color:#f39c12;">ការផ្ទុកកំពុងចំណាយពេលយូរ</p>
                    <p style="font-size:13px;color:#888;margin-top:10px;">សូមពិនិត្យការតភ្ជាប់អ៊ីនធឺណិត</p>
                    <button onclick="location.reload()" style="
                        margin-top:20px;
                        background: #f7971e;
                        color: #0a0a0a;
                        border: none;
                        padding: 10px 30px;
                        border-radius: 8px;
                        font-size: 16px;
                        font-weight: 700;
                        cursor: pointer;
                    ">🔄 ផ្ទុកឡើងវិញ</button>
                `;
            }
        }, 15000);

        // ================================================================
        //  KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                location.reload();
            }
            if (e.key === 'f' || e.key === 'F') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            }
            if (e.key === 'l' || e.key === 'L') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                if (!isLoggedIn) login();
            }
        });

        // ================================================================
        //  CONSOLE
        // ================================================================
        console.log('✅ HH888 Live (iframe) is ready!');
        console.log('📌 Press L to login | R to refresh | F for fullscreen');

        // ================================================================
        //  AUTO LOGIN? (ប្រសិនបើអូនចង់ឲ្យ Login ដោយស្វ័យប្រវត្តិ)
        // ================================================================
        // ប្រសិនបើអូនចង់ឲ្យ Login ដោយស្វ័យប្រវត្តិ សូមដក Comment បន្ទាត់ខាងក្រោមចេញ
        // setTimeout(login, 2000);
    </script>

</body>
</html>
