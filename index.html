<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HH888 Live Stream</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        /* ===== HEADER ===== */
        .header {
            background: #0d0d1a;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #222;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #1a1a2e;
            padding: 4px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #aaa;
        }

        .status .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            display: inline-block;
            transition: background 0.3s;
        }

        .status .dot.live {
            background: #2ecc71;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status .live-text {
            font-weight: 600;
            transition: color 0.3s;
        }

        .status .live-text.live {
            color: #2ecc71;
        }

        .status .live-text.offline {
            color: #e74c3c;
        }

        /* ===== PLAYER ===== */
        .player-wrapper {
            background: #000;
            position: relative;
        }

        .player-wrapper video {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
            display: block;
        }

        /* ===== INFO BAR ===== */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #0d0d1a;
            border-top: 1px solid #222;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-bar .channel-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffd200;
        }

        .info-bar .fight-no {
            background: #2c2c4a;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
        }

        .info-bar .fight-no span {
            color: #fff;
            font-weight: 700;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: #0d0d1a;
            text-align: center;
            padding: 12px;
            color: #555;
            font-size: 12px;
            border-top: 1px solid #1a1a2e;
        }

        .footer i {
            margin-right: 6px;
        }

        /* ===== TOKEN INFO ===== */
        .token-info {
            background: #0d0d1a;
            padding: 10px 24px;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .token-info .label {
            color: #555;
            font-size: 12px;
        }

        .token-info .value {
            color: #888;
            font-size: 11px;
            word-break: break-all;
            max-width: 600px;
        }

        .token-info .expiry {
            color: #f39c12;
            font-size: 12px;
            font-weight: 600;
        }

        .token-info .expiry.expired {
            color: #e74c3c;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header {
                padding: 12px 16px;
            }
            .logo h1 {
                font-size: 18px;
            }
            .status {
                font-size: 12px;
            }
            .status .dot {
                width: 10px;
                height: 10px;
            }
            .info-bar {
                padding: 10px 16px;
                font-size: 13px;
            }
            .token-info {
                padding: 8px 16px;
                flex-direction: column;
                align-items: flex-start;
            }
            .token-info .value {
                max-width: 100%;
                font-size: 10px;
            }
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #222;
            border-top-color: #f7971e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-overlay p {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <img src="https://player.cpro.uk/assets/images_v2/HH888/logo/logo.png" alt="HH888" />
                <h1>HH888</h1>
            </div>
            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span class="live-text" id="liveStatus">កំពុងភ្ជាប់...</span>
                <span id="timeDisplay" style="color:#555;font-size:12px;margin-left:5px;"></span>
            </div>
        </header>

        <!-- ===== TOKEN INFO ===== -->
        <div class="token-info">
            <span class="label">🔑 Token:</span>
            <span class="value" id="tokenDisplay">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</span>
            <span class="expiry" id="expiryDisplay">⏳ ផុតកំណត់: 03:01 PM</span>
        </div>

        <!-- ===== PLAYER ===== -->
        <div class="player-wrapper">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <p>⏳ កំពុងផ្ទុកវីដេអូ...</p>
            </div>
            <video id="media_player" autoplay playsinline webkit-playsinline controls></video>
        </div>

        <!-- ===== INFO BAR ===== -->
        <div class="info-bar">
            <span class="channel-name" id="channelName">📺 CHGW24</span>
            <span class="fight-no">លេខគូ: <span id="fightNumber">--</span></span>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <i class="fas fa-shield-alt"></i> Stream from HH888 &bull; Using direct HLS stream
        </div>
    </div>

    <!-- ===== Font Awesome ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
        // ================================================================
        //  🔑 TOKEN ថ្មីរបស់អូន
        // ================================================================
        const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NTU0NTIzMCwidXNlcm5hbWUiOiJBQlBQR0JHRzI2MiIsImlhdCI6MTc4ODQyMTY3MCwiZXhwIjoxNzg4NDI1MjcwfQ.MmtZOm515ktxNRcZDpQB3l6cuYKHOzBUR3JGPPoe6YQ';

        // ================================================================
        //  📺 STREAM URL
        // ================================================================
        const STREAM_URL = `https://cc.realtimevideo.cc/live/chgw24?origin=sb24&token=${TOKEN}`;

        // ================================================================
        //  DOM ELEMENTS
        // ================================================================
        const video = document.getElementById('media_player');
        const statusDot = document.getElementById('statusDot');
        const liveStatus = document.getElementById('liveStatus');
        const timeDisplay = document.getElementById('timeDisplay');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const fightNumber = document.getElementById('fightNumber');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const expiryDisplay = document.getElementById('expiryDisplay');

        // ================================================================
        //  DISPLAY TIME
        // ================================================================
        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = '🕐 ' + now.toLocaleTimeString('km-KH', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ================================================================
        //  DISPLAY TOKEN INFO
        // ================================================================
        function displayTokenInfo() {
            tokenDisplay.textContent = TOKEN.substring(0, 40) + '...';

            try {
                const payload = JSON.parse(atob(TOKEN.split('.')[1]));
                const expDate = new Date(payload.exp * 1000);
                const now = new Date();
                const isExpired = now > expDate;

                expiryDisplay.textContent = `⏳ ផុតកំណត់: ${expDate.toLocaleTimeString('km-KH', { hour: '2-digit', minute: '2-digit', hour12: true })}`;
                expiryDisplay.className = 'expiry' + (isExpired ? ' expired' : '');
            } catch (e) {
                expiryDisplay.textContent = '⚠️ មិនអាចអាន Token';
            }
        }
        displayTokenInfo();

        // ================================================================
        //  UPDATE STATUS
        // ================================================================
        function setStatus(text, isLive = false) {
            liveStatus.textContent = text;
            liveStatus.className = 'live-text' + (isLive ? ' live' : '');
            statusDot.className = 'dot' + (isLive ? ' live' : '');
        }

        // ================================================================
        //  LOAD VIDEO
        // ================================================================
        function loadVideo() {
            setStatus('⏳ កំពុងផ្ទុក...', false);
            loadingOverlay.classList.remove('hidden');

            video.src = STREAM_URL;
            video.load();

            video.play().catch(err => {
                console.warn('Autoplay blocked:', err);
                setStatus('▶️ ចុច Play ដើម្បីចាក់', false);
                loadingOverlay.classList.add('hidden');
            });
        }

        // ================================================================
        //  VIDEO EVENTS
        // ================================================================
        video.addEventListener('canplay', function() {
            setStatus('🟢 LIVE', true);
            loadingOverlay.classList.add('hidden');

            const num = Math.floor(Math.random() * 90) + 10;
            fightNumber.textContent = num;
        });

        video.addEventListener('waiting', function() {
            setStatus('⏳ កំពុងផ្ទុក...', false);
        });

        video.addEventListener('playing', function() {
            setStatus('🟢 LIVE', true);
            loadingOverlay.classList.add('hidden');
        });

        video.addEventListener('error', function() {
            const error = video.error;
            console.error('Video error:', error);

            let errorMsg = '❌ កំហុសមិនស្គាល់';
            if (error) {
                switch (error.code) {
                    case 1: errorMsg = '❌ ការផ្ទុកត្រូវបានបញ្ឈប់';
                        break;
                    case 2: errorMsg = '❌ បញ្ហាបណ្តាញ ឬម៉ាស៊ីនមេ';
                        break;
                    case 3: errorMsg = '❌ ទម្រង់វីដេអូមិនគាំទ្រ';
                        break;
                    case 4: errorMsg = '❌ រកមិនឃើញវីដេអូ';
                        break;
                    default: errorMsg = `❌ កំហុសលេខ ${error.code}`;
                }
            }

            setStatus(errorMsg, false);
            loadingOverlay.classList.add('hidden');
        });

        // ================================================================
        //  FIGHT NUMBER - AUTO UPDATE
        // ================================================================
        setInterval(() => {
            const currentText = fightNumber.textContent;
            if (currentText === '--') {
                fightNumber.textContent = String(Math.floor(Math.random() * 90) + 10);
            } else {
                const num = parseInt(currentText);
                if (!isNaN(num) && num < 200) {
                    fightNumber.textContent = String(num + 1);
                } else {
                    fightNumber.textContent = String(Math.floor(Math.random() * 90) + 10);
                }
            }
        }, 8000);

        // ================================================================
        //  KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                loadVideo();
            }
            if (e.key === 'f' || e.key === 'F') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            }
            if (e.key === ' ') {
                e.preventDefault();
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        });

        // ================================================================
        //  INITIALIZE
        // ================================================================
        loadVideo();

        console.log('✅ HH888 Live Stream is ready!');
        console.log('📺 Stream URL:', STREAM_URL);
        console.log('⌨️  R = Reload | F = Fullscreen | Space = Play/Pause');
    </script>

</body>
</html>
