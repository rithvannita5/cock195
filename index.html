<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HH888 Live Stream</title>

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 2px solid #222;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #1a1a2e;
            padding: 5px;
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: #2ecc71;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ===== CHANNEL GRID ===== */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .channel-btn {
            background: #1a1a2e;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
        }

        .channel-btn:hover {
            background: #252540;
            border-color: #f7971e;
            color: #fff;
            transform: translateY(-3px);
        }

        .channel-btn.active {
            border-color: #f7971e;
            background: #252540;
            color: #ffd200;
            box-shadow: 0 0 25px rgba(247, 151, 30, 0.25);
        }

        .channel-btn .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .channel-btn .badge-live {
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }

        /* ===== VIDEO PLAYER ===== */
        .player-wrapper {
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .player-wrapper video {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 16 / 9;
            background: #000;
            display: block;
        }

        .video-js .vjs-big-play-button {
            background: rgba(247, 151, 30, 0.85) !important;
            border-radius: 50% !important;
            width: 70px !important;
            height: 70px !important;
            line-height: 70px !important;
            font-size: 28px !important;
            border: none !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
        }

        .video-js .vjs-big-play-button:hover {
            background: #f7971e !important;
        }

        /* ===== INFO BAR ===== */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0d0d1a;
            border-top: 1px solid #222;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-bar .channel-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffd200;
        }

        .info-bar .fight-no {
            background: #2c2c4a;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 14px;
            color: #aaa;
        }

        .info-bar .fight-no span {
            color: #fff;
            font-weight: 700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .logo {
                justify-content: center;
            }
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 8px;
            }
            .channel-btn {
                font-size: 12px;
                padding: 10px 4px;
            }
            .channel-btn .icon {
                font-size: 22px;
            }
            .info-bar {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <img src="https://player.cpro.uk/assets/images_v2/HH888/logo/logo.png" alt="HH888" />
                <h1>HH888</h1>
            </div>
            <div class="status-badge">
                <span class="dot"></span>
                <span id="liveStatus">LIVE</span>
            </div>
        </header>

        <!-- ===== CHANNEL SELECTOR ===== -->
        <div class="channel-grid" id="channelGrid">
            <!-- Channels will be rendered by JavaScript -->
        </div>

        <!-- ===== VIDEO PLAYER ===== -->
        <div class="player-wrapper">
            <video
                id="myPlayer"
                class="video-js vjs-default-skin vjs-big-play-centered"
                controls
                preload="auto"
                autoplay
                muted
                playsinline
            >
                <p class="vjs-no-js">សូមបើក JavaScript ដើម្បីមើលវីដេអូ</p>
            </video>

            <!-- ===== INFO BAR ===== -->
            <div class="info-bar">
                <span class="channel-name" id="currentChannelName">SBB</span>
                <span class="fight-no">លេខគូ: <span id="fightNumber">--</span></span>
            </div>
        </div>

        <p style="text-align:center;margin-top:20px;color:#555;font-size:13px;">
            <i class="fas fa-shield-alt"></i> Stream from HH888 &bull; Only works on HLS-supported browsers
        </p>
    </div>

    <!-- ===== LIBRARIES ===== -->
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-hls@5.15.0/dist/videojs-contrib-hls.min.js">
    </script>

    <script>
        // ============================================================
        //  DANH SÁCH CHANNEL LẤY TỪ FILE HTML GỐC CỦA HH888
        // ============================================================
        const channels = [{
            id: 8,
            name: 'SBB',
            url: 'https://cc.realtimevideo.cc/live/frmsbvdolive?origin=HH888',
            icon: '🐓'
        }, {
            id: 47,
            name: 'V168',
            url: 'https://cc.realtimevideo.cc/live/gv168?origin=HH888',
            icon: '🎰'
        }, {
            id: 1,
            name: 'PH',
            url: 'https://cc.realtimevideo.cc/live/COCKFIGHPHH?origin=HH888',
            icon: '🐔'
        }, {
            id: 2,
            name: 'BAC',
            url: 'https://cc.realtimevideo.cc/live/HH888SEXYBACC?origin=HH888',
            icon: '🃏'
        }, {
            id: 23,
            name: 'TD',
            url: 'https://cc.realtimevideo.cc/live/HH888SEXYTIGERDRAGON?origin=HH888',
            icon: '🐉'
        }, {
            id: 37,
            name: 'W8_BAC1',
            url: 'https://cc.realtimevideo.cc/live/w8bacctable0010?origin=HH888',
            icon: '🃏'
        }, {
            id: 30,
            name: 'W8_BAC2',
            url: 'https://cc.realtimevideo.cc/live/w8bacctable0020?origin=HH888',
            icon: '🃏'
        }, {
            id: 40,
            name: 'W8_TD1',
            url: 'https://cc.realtimevideo.cc/live/w8tdtable0010?origin=HH888',
            icon: '🐉'
        }, {
            id: 46,
            name: 'W8_TD2',
            url: 'https://cc.realtimevideo.cc/live/w8tdtable002?origin=HH888',
            icon: '🐉'
        }, {
            id: 27,
            name: 'SGMC',
            url: 'https://cc.realtimevideo.cc/live/COCKFIGHPH1?',
            icon: '🐓'
        }];

        // ============================================================
        //  KHỞI TẠO PLAYER
        // ============================================================
        const player = videojs('myPlayer', {
            html5: {
                hls: {
                    enableLowInitialPlaylist: true,
                    smoothQualityChange: true,
                    overrideNative: true,
                }
            },
            controlBar: {
                volumePanel: { inline: false },
                pictureInPictureToggle: true
            }
        });

        let currentChannel = channels[0];

        // ============================================================
        //  RENDER DANH SÁCH CHANNEL
        // ============================================================
        function renderChannels() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            channels.forEach(ch => {
                const btn = document.createElement('div');
                btn.className = 'channel-btn' + (ch.id === currentChannel.id ? ' active' : '');
                btn.dataset.id = ch.id;
                btn.innerHTML = `
                    <span class="icon">${ch.icon}</span>
                    ${ch.name}
                    <span class="badge-live">LIVE</span>
                `;
                btn.addEventListener('click', () => switchChannel(ch));
                grid.appendChild(btn);
            });
        }

        // ============================================================
        //  SWITCH CHANNEL
        // ============================================================
        function switchChannel(channel) {
            if (!channel || !channel.url) return;

            currentChannel = channel;

            document.querySelectorAll('.channel-btn').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.id) === channel.id);
            });
            document.getElementById('currentChannelName').textContent = channel.name;
            document.getElementById('fightNumber').textContent = '--';

            const isHLS = channel.url.includes('.m3u8') || channel.url.includes('realtimevideo.cc');

            if (isHLS) {
                player.src({
                    src: channel.url,
                    type: 'application/x-mpegURL'
                });
            } else {
                player.src({
                    src: channel.url,
                    type: 'video/mp4'
                });
            }

            player.autoplay(true);
            player.play().catch(err => {
                console.warn('Autoplay bị chặn:', err);
            });

            document.getElementById('liveStatus').textContent = 'LIVE';
        }

        // ============================================================
        //  KHỞI TẠO APP
        // ============================================================
        renderChannels();

        player.ready(() => {
            switchChannel(currentChannel);
        });

        // ============================================================
        //  XỬ LÝ LỖI & TỰ ĐỘNG LOAD LẠI
        // ============================================================
        player.on('error', function() {
            console.error('Lỗi phát video, thử tải lại sau 3s...');
            document.getElementById('liveStatus').textContent = 'RECONNECTING...';
            setTimeout(() => {
                switchChannel(currentChannel);
            }, 3000);
        });

        // Hiển thị số hiệu fight (giả lập)
        setInterval(() => {
            const fightNo = document.getElementById('fightNumber');
            if (fightNo.textContent === '--') {
                fightNo.textContent = String(Math.floor(Math.random() * 90) + 10);
            } else {
                fightNo.textContent = String(parseInt(fightNo.textContent) + 1);
            }
        }, 8000);

        console.log('✅ HH888 Live Web App is ready!');
    </script>

</body>
</html>
