<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HH888 Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .header {
            background: #111;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo img { width: 44px; height: 44px; border-radius: 10px; background: #1a1a2e; padding: 4px; }
        .logo h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #aaa; }
        .status .dot { width: 12px; height: 12px; border-radius: 50%; background: #2ecc71; animation: blink 1.2s infinite; display: inline-block; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .status .live-text { color: #2ecc71; font-weight: 600; }

        .iframe-container {
            width: 100%;
            height: calc(100vh - 160px);
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #0d0d1a;
            border-top: 1px solid #222;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            border-radius: 0 0 15px 15px;
        }
        .info-bar .channel-name { font-size: 16px; font-weight: 700; color: #ffd200; }
        .info-bar .fight-no { background: #2c2c4a; padding: 4px 16px; border-radius: 30px; font-size: 13px; color: #aaa; }
        .info-bar .fight-no span { color: #fff; font-weight: 700; }

        .footer { text-align: center; padding: 12px; color: #555; font-size: 12px; }
        .footer i { margin-right: 6px; }

        .token-box {
            background: #0d0d1a;
            padding: 8px 20px;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: #888;
        }
        .token-box .label { color: #555; }
        .token-box .value { word-break: break-all; max-width: 500px; }
        .token-box .expiry { color: #f39c12; font-weight: 600; }

        @media (max-width: 640px) {
            .header { padding: 8px 12px; }
            .logo h1 { font-size: 18px; }
            .status { font-size: 12px; }
            .iframe-container { height: calc(100vh - 180px); }
            .token-box { font-size: 10px; padding: 6px 12px; flex-direction: column; align-items: flex-start; }
            .token-box .value { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">
            <img src="https://player.cpro.uk/assets/images_v2/HH888/logo/logo.png" alt="HH888" />
            <h1>HH888</h1>
        </div>
        <div class="status">
            <span class="dot"></span>
            <span class="live-text" id="liveStatus">LIVE</span>
            <span id="timeDisplay" style="color:#555;font-size:12px;margin-left:5px;"></span>
        </div>
    </header>

    <!-- ===== TOKEN INFO ===== -->
    <div class="token-box">
        <span class="label">🔑 Token:</span>
        <span class="value" id="tokenDisplay">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</span>
        <span class="expiry" id="expiryDisplay">⏳ ផុតកំណត់: --</span>
    </div>

    <!-- ===== IFRAME ===== -->
    <div class="iframe-container">
        <iframe
            id="myIframe"
            src=""
            allow="autoplay; encrypted-media; fullscreen"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
    </div>

    <!-- ===== INFO BAR ===== -->
    <div class="info-bar">
        <span class="channel-name" id="channelName">📺 CHGW24</span>
        <span class="fight-no">លេខគូ: <span id="fightNumber">--</span></span>
    </div>

    <div class="footer">
        <i class="fas fa-shield-alt"></i> Stream from HH888 &bull; Using iframe
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
        // ================================================================
        //  🔑 TOKEN របស់អូន
        // ================================================================
        const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NTU0NTIzMCwidXNlcm5hbWUiOiJBQlBQR0JHRzI2MiIsImlhdCI6MTc4ODQyMTY3MCwiZXhwIjoxNzg4NDI1MjcwfQ.MmtZOm515ktxNRcZDpQB3l6cuYKHOzBUR3JGPPoe6YQ';

        // ================================================================
        //  📺 STREAM URL
        // ================================================================
        const STREAM_URL = `https://cc.realtimevideo.cc/live/chgw24?origin=sb24&token=${TOKEN}`;

        // ================================================================
        //  DOM ELEMENTS
        // ================================================================
        const iframe = document.getElementById('myIframe');
        const timeDisplay = document.getElementById('timeDisplay');
        const fightNumber = document.getElementById('fightNumber');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const expiryDisplay = document.getElementById('expiryDisplay');
        const liveStatus = document.getElementById('liveStatus');

        // ================================================================
        //  DISPLAY TIME
        // ================================================================
        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = '🕐 ' + now.toLocaleTimeString('km-KH', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ================================================================
        //  DISPLAY TOKEN INFO
        // ================================================================
        function displayTokenInfo() {
            tokenDisplay.textContent = TOKEN.substring(0, 40) + '...';

            try {
                const payload = JSON.parse(atob(TOKEN.split('.')[1]));
                const expDate = new Date(payload.exp * 1000);
                const now = new Date();
                const isExpired = now > expDate;

                expiryDisplay.textContent = `⏳ ផុតកំណត់: ${expDate.toLocaleTimeString('km-KH', { hour: '2-digit', minute: '2-digit', hour12: true })}`;
                expiryDisplay.style.color = isExpired ? '#e74c3c' : '#f39c12';
            } catch (e) {
                expiryDisplay.textContent = '⚠️ មិនអាចអាន Token';
            }
        }
        displayTokenInfo();

        // ================================================================
        //  LOAD IFRAME
        // ================================================================
        function loadStream() {
            iframe.src = STREAM_URL;
            liveStatus.textContent = '🔄 LOADING...';
            console.log('📺 Loading stream:', STREAM_URL);

            // Update fight number
            setTimeout(() => {
                const num = Math.floor(Math.random() * 90) + 10;
                fightNumber.textContent = num;
                liveStatus.textContent = '🟢 LIVE';
            }, 3000);
        }

        // ================================================================
        //  IFRAME EVENTS
        // ================================================================
        iframe.addEventListener('load', function() {
            liveStatus.textContent = '🟢 LIVE';
        });

        iframe.addEventListener('error', function() {
            liveStatus.textContent = '❌ ERROR';
        });

        // ================================================================
        //  FIGHT NUMBER - AUTO UPDATE
        // ================================================================
        setInterval(() => {
            const currentText = fightNumber.textContent;
            if (currentText === '--') {
                fightNumber.textContent = String(Math.floor(Math.random() * 90) + 10);
            } else {
                const num = parseInt(currentText);
                if (!isNaN(num) && num < 200) {
                    fightNumber.textContent = String(num + 1);
                } else {
                    fightNumber.textContent = String(Math.floor(Math.random() * 90) + 10);
                }
            }
        }, 8000);

        // ================================================================
        //  KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                loadStream();
            }
            if (e.key === 'f' || e.key === 'F') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            }
        });

        // ================================================================
        //  INITIALIZE
        // ================================================================
        loadStream();

        console.log('✅ HH888 Live with iframe is ready!');
        console.log('📺 Stream URL:', STREAM_URL);
        console.log('⌨️  R = Reload | F = Fullscreen');
    </script>

</body>
</html>
