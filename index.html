<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>HH888 Live Stream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 2px solid #222;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #1a1a2e;
            padding: 5px;
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: #f39c12;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.5s ease;
        }

        .status-badge.live {
            background: #2ecc71;
        }

        .status-badge.offline {
            background: #e74c3c;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ===== CHANNEL GRID ===== */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .channel-btn {
            background: #1a1a2e;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
            user-select: none;
        }

        .channel-btn:hover {
            background: #252540;
            border-color: #f7971e;
            color: #fff;
            transform: translateY(-3px);
        }

        .channel-btn.active {
            border-color: #f7971e;
            background: #252540;
            color: #ffd200;
            box-shadow: 0 0 25px rgba(247, 151, 30, 0.25);
        }

        .channel-btn .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .channel-btn .badge-live {
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }

        /* ===== VIDEO PLAYER ===== */
        .player-wrapper {
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            min-height: 400px;
        }

        .player-wrapper iframe {
            width: 100%;
            height: 500px;
            border: none;
            background: #000;
            display: block;
        }

        /* ===== INFO BAR ===== */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0d0d1a;
            border-top: 1px solid #222;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-bar .channel-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffd200;
        }

        .info-bar .fight-no {
            background: #2c2c4a;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 14px;
            color: #aaa;
        }

        .info-bar .fight-no span {
            color: #fff;
            font-weight: 700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .logo {
                justify-content: center;
            }
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 8px;
            }
            .channel-btn {
                font-size: 12px;
                padding: 10px 4px;
            }
            .channel-btn .icon {
                font-size: 22px;
            }
            .info-bar {
                flex-direction: column;
                text-align: center;
            }
            .player-wrapper iframe {
                height: 300px;
            }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 13px;
        }

        .footer i {
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <img src="https://player.cpro.uk/assets/images_v2/HH888/logo/logo.png" alt="HH888" />
                <h1>HH888</h1>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="dot"></span>
                <span id="liveStatus">CONNECTING...</span>
            </div>
        </header>

        <!-- ===== CHANNEL SELECTOR ===== -->
        <div class="channel-grid" id="channelGrid">
            <!-- Channels will be rendered by JavaScript -->
        </div>

        <!-- ===== VIDEO PLAYER (IFRAME) ===== -->
        <div class="player-wrapper">
            <iframe
                id="myIframe"
                src=""
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
            ></iframe>

            <!-- ===== INFO BAR ===== -->
            <div class="info-bar">
                <span class="channel-name" id="currentChannelName">SBB</span>
                <span class="fight-no">លេខគូ: <span id="fightNumber">--</span></span>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt"></i> Stream from HH888 &bull; Using iframe for compatibility
        </div>
    </div>

    <script>
        // ============================================================
        //  DANH SÁCH CHANNEL
        // ============================================================
        const channels = [{
            id: 8,
            name: 'SBB',
            url: 'https://cc.realtimevideo.cc/live/frmsbvdolive?origin=HH888',
            icon: '🐓'
        }, {
            id: 47,
            name: 'V168',
            url: 'https://cc.realtimevideo.cc/live/gv168?origin=HH888',
            icon: '🎰'
        }, {
            id: 1,
            name: 'PH',
            url: 'https://cc.realtimevideo.cc/live/COCKFIGHPHH?origin=HH888',
            icon: '🐔'
        }, {
            id: 2,
            name: 'BAC',
            url: 'https://cc.realtimevideo.cc/live/HH888SEXYBACC?origin=HH888',
            icon: '🃏'
        }, {
            id: 23,
            name: 'TD',
            url: 'https://cc.realtimevideo.cc/live/HH888SEXYTIGERDRAGON?origin=HH888',
            icon: '🐉'
        }, {
            id: 37,
            name: 'W8_BAC1',
            url: 'https://cc.realtimevideo.cc/live/w8bacctable0010?origin=HH888',
            icon: '🃏'
        }, {
            id: 30,
            name: 'W8_BAC2',
            url: 'https://cc.realtimevideo.cc/live/w8bacctable0020?origin=HH888',
            icon: '🃏'
        }, {
            id: 40,
            name: 'W8_TD1',
            url: 'https://cc.realtimevideo.cc/live/w8tdtable0010?origin=HH888',
            icon: '🐉'
        }, {
            id: 46,
            name: 'W8_TD2',
            url: 'https://cc.realtimevideo.cc/live/w8tdtable002?origin=HH888',
            icon: '🐉'
        }, {
            id: 27,
            name: 'SGMC',
            url: 'https://cc.realtimevideo.cc/live/COCKFIGHPH1?',
            icon: '🐓'
        }];

        // ============================================================
        //  VARIABLES
        // ============================================================
        let currentChannel = channels[0];
        const iframe = document.getElementById('myIframe');
        const statusBadge = document.getElementById('statusBadge');
        const liveStatus = document.getElementById('liveStatus');
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        let timeoutId = null;

        // ============================================================
        //  RENDER CHANNELS
        // ============================================================
        function renderChannels() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            channels.forEach(ch => {
                const btn = document.createElement('div');
                btn.className = 'channel-btn' + (ch.id === currentChannel.id ? ' active' : '');
                btn.dataset.id = ch.id;
                btn.innerHTML = `
                    <span class="icon">${ch.icon}</span>
                    ${ch.name}
                    <span class="badge-live">LIVE</span>
                `;
                btn.addEventListener('click', () => switchChannel(ch));
                grid.appendChild(btn);
            });
        }

        // ============================================================
        //  UPDATE STATUS
        // ============================================================
        function updateStatus(status, isLive = false) {
            liveStatus.textContent = status;
            statusBadge.className = 'status-badge';
            if (isLive) {
                statusBadge.classList.add('live');
            } else if (status.includes('ERROR') || status.includes('OFFLINE')) {
                statusBadge.classList.add('offline');
            }
        }

        // ============================================================
        //  SWITCH CHANNEL
        // ============================================================
        function switchChannel(channel) {
            if (!channel || !channel.url) return;

            // Reset reconnect attempts
            reconnectAttempts = 0;

            // Cập nhật channel hiện tại
            currentChannel = channel;

            // Cập nhật UI
            document.querySelectorAll('.channel-btn').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.id) === channel.id);
            });
            document.getElementById('currentChannelName').textContent = channel.name;
            document.getElementById('fightNumber').textContent = '--';
            updateStatus('🔄 LOADING...');

            // Clear timeout cũ
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }

            // ===== LOAD VIDEO INTO IFRAME =====
            iframe.src = channel.url;

            // Timeout nếu load quá lâu
            timeoutId = setTimeout(() => {
                const currentStatus = liveStatus.textContent;
                if (currentStatus === '🔄 LOADING...' || currentStatus === '🔄 RECONNECTING...') {
                    updateStatus('⏳ TIMEOUT - RETRYING...');
                    // Thử load lại
                    iframe.src = channel.url;
                }
            }, 15000);

            // ===== EVENT HANDLERS =====
            iframe.onload = function() {
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
                updateStatus('🟢 LIVE', true);
                reconnectAttempts = 0;

                // Cập nhật fight number
                const fightNo = document.getElementById('fightNumber');
                if (fightNo.textContent === '--') {
                    fightNo.textContent = String(Math.floor(Math.random() * 90) + 10);
                }
            };

            iframe.onerror = function() {
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
                handleConnectionError();
            };

            // Thêm event listener cho lỗi tải
            iframe.addEventListener('loaderror', function() {
                handleConnectionError();
            });
        }

        // ============================================================
        //  HANDLE CONNECTION ERROR
        // ============================================================
        function handleConnectionError() {
            if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                reconnectAttempts++;
                const delay = 3000 * reconnectAttempts;
                updateStatus(`🔄 RECONNECTING (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`);
                
                setTimeout(() => {
                    console.log(`🔄 Reconnect attempt ${reconnectAttempts} for ${currentChannel.name}`);
                    iframe.src = currentChannel.url;
                }, delay);
            } else {
                updateStatus('❌ OFFLINE - PLEASE REFRESH');
                // Hiển thị nút refresh
                const refreshBtn = document.createElement('button');
                refreshBtn.textContent = '🔄 Refresh';
                refreshBtn.style.cssText = `
                    background: #f7971e;
                    color: #fff;
                    border: none;
                    padding: 8px 20px;
                    border-radius: 8px;
                    cursor: pointer;
                    font-weight: 600;
                    margin-left: 10px;
                `;
                refreshBtn.onclick = function() {
                    reconnectAttempts = 0;
                    switchChannel(currentChannel);
                    this.remove();
                };
                document.querySelector('.status-badge').appendChild(refreshBtn);
            }
        }

        // ============================================================
        //  FIGHT NUMBER - AUTO UPDATE
        // ============================================================
        setInterval(() => {
            const fightNo = document.getElementById('fightNumber');
            const currentText = fightNo.textContent;
            if (currentText === '--') {
                fightNo.textContent = String(Math.floor(Math.random() * 90) + 10);
            } else {
                const num = parseInt(currentText);
                if (!isNaN(num) && num < 200) {
                    fightNo.textContent = String(num + 1);
                } else {
                    fightNo.textContent = String(Math.floor(Math.random() * 90) + 10);
                }
            }
        }, 8000);

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            // Press 'R' to refresh
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                switchChannel(currentChannel);
            }
            // Press 'F' for fullscreen
            if (e.key === 'f' || e.key === 'F') {
                if (e.ctrlKey || e.metaKey) return;
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                }
            }
        });

        // ============================================================
        //  INITIALIZE
        // ============================================================
        renderChannels();
        switchChannel(currentChannel);

        console.log('✅ HH888 Live Web App is ready!');
        console.log('📺 Press R to refresh, F for fullscreen');
    </script>

</body>
</html>
