<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HH888 Live Stream</title>

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 2px solid #222;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #1a1a2e;
            padding: 5px;
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: #2ecc71;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ===== CHANNEL GRID ===== */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .channel-btn {
            background: #1a1a2e;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
            user-select: none;
        }

        .channel-btn:hover {
            background: #252540;
            border-color: #f7971e;
            color: #fff;
            transform: translateY(-3px);
        }

        .channel-btn.active {
            border-color: #f7971e;
            background: #252540;
            color: #ffd200;
            box-shadow: 0 0 25px rgba(247, 151, 30, 0.25);
        }

        .channel-btn .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .channel-btn .badge-live {
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }

        /* ===== VIDEO PLAYER ===== */
        .player-wrapper {
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .player-wrapper video {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 16 / 9;
            background: #000;
            display: block;
        }

        .video-js .vjs-big-play-button {
            background: rgba(247, 151, 30, 0.85) !important;
            border-radius: 50% !important;
            width: 70px !important;
            height: 70px !important;
            line-height: 70px !important;
            font-size: 28px !important;
            border: none !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
        }

        .video-js .vjs-big-play-button:hover {
            background: #f7971e !important;
        }

        .vjs-error .vjs-error-display {
            background: rgba(0,0,0,0.8) !important;
        }

        /* ===== INFO BAR ===== */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0d0d1a;
            border-top: 1px solid #222;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-bar .channel-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffd200;
        }

        .info-bar .fight-no {
            background: #2c2c4a;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 14px;
            color: #aaa;
        }

        .info-bar .fight-no span {
            color: #fff;
            font-weight: 700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .logo {
                justify-content: center;
            }
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 8px;
            }
            .channel-btn {
                font-size: 12px;
                padding: 10px 4px;
            }
            .channel-btn .icon {
                font-size: 22px;
            }
            .info-bar {
                flex-direction: column;
                text-align: center;
            }
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 13px;
        }

        .footer i {
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <img src="https://player.cpro.uk/assets/images_v2/HH888/logo/logo.png" alt="HH888" />
                <h1>HH888</h1>
            </div>
            <div class="status-badge">
                <span class="dot"></span>
                <span id="liveStatus">LIVE</span>
            </div>
        </header>

        <!-- ===== CHANNEL SELECTOR ===== -->
        <div class="channel-grid" id="channelGrid">
            <!-- Channels will be rendered by JavaScript -->
        </div>

        <!-- ===== VIDEO PLAYER ===== -->
        <div class="player-wrapper">
            <video
                id="myPlayer"
                class="video-js vjs-default-skin vjs-big-play-centered"
                controls
                preload="auto"
                autoplay
                muted
                playsinline
            >
                <p class="vjs-no-js">សូមបើក JavaScript ដើម្បីមើលវីដេអូ</p>
            </video>

            <!-- ===== INFO BAR ===== -->
            <div class="info-bar">
                <span class="channel-name" id="currentChannelName">SBB</span>
                <span class="fight-no">លេខគូ: <span id="fightNumber">--</span></span>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <i class="fas fa-shield-alt"></i> Stream from HH888 &bull; Requires HLS-supported browser
        </div>
    </div>

    <!-- ===== LIBRARIES ===== -->
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-hls@5.15.0/dist/videojs-contrib-hls.min.js">
    </script>

    <script>
        // ============================================================
        //  DANH SÁCH CHANNEL (Lấy từ file HTML gốc của HH888)
        // ============================================================
        const channels = [{
            id: 8,
            name: 'SBB',
            url: 'https://cc.realtimevideo.cc/live/frmsbvdolive?origin=HH888',
            icon: '🐓'
        }, {
            id: 47,
            name: 'V168',
            url: 'https://cc.realtimevideo.cc/live/gv168?origin=HH888',
            icon: '🎰'
        }, {
            id: 1,
            name: 'PH',
            url: 'https://cc.realtimevideo.cc/live/COCKFIGHPHH?origin=HH888',
            icon: '🐔'
        }, {
            id: 2,
            name: 'BAC',
            url: 'https://cc.realtimevideo.cc/live/HH888SEXYBACC?origin=HH888',
            icon: '🃏'
        }, {
            id: 23,
            name: 'TD',
            url: 'https://cc.realtimevideo.cc/live/HH888SEXYTIGERDRAGON?origin=HH888',
            icon: '🐉'
        }, {
            id: 37,
            name: 'W8_BAC1',
            url: 'https://cc.realtimevideo.cc/live/w8bacctable0010?origin=HH888',
            icon: '🃏'
        }, {
            id: 30,
            name: 'W8_BAC2',
            url: 'https://cc.realtimevideo.cc/live/w8bacctable0020?origin=HH888',
            icon: '🃏'
        }, {
            id: 40,
            name: 'W8_TD1',
            url: 'https://cc.realtimevideo.cc/live/w8tdtable0010?origin=HH888',
            icon: '🐉'
        }, {
            id: 46,
            name: 'W8_TD2',
            url: 'https://cc.realtimevideo.cc/live/w8tdtable002?origin=HH888',
            icon: '🐉'
        }, {
            id: 27,
            name: 'SGMC',
            url: 'https://cc.realtimevideo.cc/live/COCKFIGHPH1?',
            icon: '🐓'
        }];

        // ============================================================
        //  KHỞI TẠO PLAYER
        // ============================================================
        const player = videojs('myPlayer', {
            html5: {
                hls: {
                    enableLowInitialPlaylist: true,
                    smoothQualityChange: true,
                    overrideNative: true,
                    handleManifestRedirects: true
                }
            },
            controlBar: {
                volumePanel: { inline: false },
                pictureInPictureToggle: true
            }
        });

        let currentChannel = channels[0];
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;

        // ============================================================
        //  RENDER DANH SÁCH CHANNEL
        // ============================================================
        function renderChannels() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            channels.forEach(ch => {
                const btn = document.createElement('div');
                btn.className = 'channel-btn' + (ch.id === currentChannel.id ? ' active' : '');
                btn.dataset.id = ch.id;
                btn.innerHTML = `
                    <span class="icon">${ch.icon}</span>
                    ${ch.name}
                    <span class="badge-live">LIVE</span>
                `;
                btn.addEventListener('click', () => switchChannel(ch));
                grid.appendChild(btn);
            });
        }

        // ============================================================
        //  SWITCH CHANNEL
        // ============================================================
        function switchChannel(channel) {
            if (!channel || !channel.url) return;

            currentChannel = channel;
            reconnectAttempts = 0;

            // Cập nhật UI
            document.querySelectorAll('.channel-btn').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.id) === channel.id);
            });
            document.getElementById('currentChannelName').textContent = channel.name;
            document.getElementById('fightNumber').textContent = '--';
            document.getElementById('liveStatus').textContent = 'LOADING...';

            // Kiểm tra loại URL
            const isHLS = channel.url.includes('.m3u8') || 
                         channel.url.includes('realtimevideo.cc') ||
                         channel.url.includes('.m3u');

            if (isHLS) {
                player.src({
                    src: channel.url,
                    type: 'application/x-mpegURL'
                });
            } else {
                player.src({
                    src: channel.url,
                    type: 'video/mp4'
                });
            }

            // Tự động phát
            player.autoplay(true);
            player.play().catch(err => {
                console.warn('Autoplay bị chặn:', err);
                document.getElementById('liveStatus').textContent = 'PRESS PLAY';
            });

            // Cập nhật fight number sau khi tải
            setTimeout(() => {
                if (document.getElementById('fightNumber').textContent === '--') {
                    document.getElementById('fightNumber').textContent = String(Math.floor(Math.random() * 90) + 10);
                }
            }, 2000);
        }

        // ============================================================
        //  XỬ LÝ LỖI & TỰ ĐỘNG KẾT NỐI LẠI
        // ============================================================
        player.on('error', function() {
            const error = player.error();
            console.error('Lỗi phát video:', error);

            // Hiển thị thông báo lỗi thân thiện
            let errorMsg = 'Lỗi kết nối';
            if (error && error.code === 4) {
                errorMsg = 'Không tìm thấy video stream';
            } else if (error && error.code === 2) {
                errorMsg = 'Lỗi mạng hoặc server';
            }
            document.getElementById('liveStatus').textContent = '⚠️ ' + errorMsg;

            // Tự động thử kết nối lại
            if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                reconnectAttempts++;
                const delay = 3000 * reconnectAttempts;
                document.getElementById('liveStatus').textContent = `🔄 Thử lại (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`;
                
                setTimeout(() => {
                    console.log(`Thử kết nối lại lần ${reconnectAttempts}...`);
                    switchChannel(currentChannel);
                }, delay);
            } else {
                document.getElementById('liveStatus').textContent = '❌ Không thể kết nối';
            }
        });

        // Xử lý khi player sẵn sàng
        player.on('loadeddata', function() {
            document.getElementById('liveStatus').textContent = 'LIVE';
            reconnectAttempts = 0;
        });

        // Xử lý khi kết nối bị mất
        player.on('waiting', function() {
            document.getElementById('liveStatus').textContent = '⏳ Đang tải...';
        });

        // Xử lý khi kết nối lại thành công
        player.on('canplay', function() {
            document.getElementById('liveStatus').textContent = 'LIVE';
        });

        // ============================================================
        //  FIGHT NUMBER - CẬP NHẬT TỰ ĐỘNG (GIẢ LẬP)
        // ============================================================
        setInterval(() => {
            const fightNo = document.getElementById('fightNumber');
            const currentText = fightNo.textContent;
            if (currentText === '--') {
                fightNo.textContent = String(Math.floor(Math.random() * 90) + 10);
            } else {
                const num = parseInt(currentText);
                if (!isNaN(num) && num < 200) {
                    fightNo.textContent = String(num + 1);
                } else {
                    fightNo.textContent = String(Math.floor(Math.random() * 90) + 10);
                }
            }
        }, 8000);

        // ============================================================
        //  KHỞI TẠO APP
        // ============================================================
        renderChannels();

        player.ready(() => {
            console.log('✅ Player đã sẵn sàng!');
            switchChannel(currentChannel);
        });

        console.log('✅ HH888 Live Web App is ready!');
    </script>

</body>
</html>
